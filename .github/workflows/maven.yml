# Builds the bot. When a tag starting with "v" is pushed (e.g. git tag v1.0.1 && git push --tags)
# the built jar is attached to a GitHub release automatically.
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B -DskipTests package

      - name: Rename jar
        run: |
          ls -la target/*.jar
          # the shaded (all-in-one) jar is the largest one in target/
          cp "$(ls -S target/*.jar | head -n 1)" JMusicBot-ML.jar

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: JMusicBot-ML
          path: JMusicBot-ML.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JMusicBot-ML.jar
          generate_release_notes: true
