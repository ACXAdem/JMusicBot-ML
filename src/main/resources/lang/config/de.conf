//______________________________________________________________
//                     ========================
//                      JMusicBot-ML-Einstellungen  [lang:de]
//                     ========================
//
// Zeilen, die mit // beginnen, werden ignoriert (Kommentare).
// token und owner MÜSSEN gesetzt werden.
// Alle anderen Einstellungen haben Standardwerte.
// Es wird empfohlen, diese Datei mit einem Editor wie Notepad++, VS Code oder nano zu bearbeiten.
//‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾

// Version dieser Datei. Wird beim Start verwendet, um die Datei automatisch zu aktualisieren.
// Diesen Wert nicht ändern.
configversion = 7

// Sprache des Bots. Optionen: "en" (English), "tr" (Türkçe), "ja" (日本語), "de" (Deutsch), "es" (Español), "ru" (Русский)
// Ändern und den Bot neu starten; auch die Kommentare dieser Datei werden in diese Sprache übersetzt.
// Die Beschreibungen der Slash-Befehle sieht jeder Benutzer in seiner eigenen Discord-Sprache.
language = "de"

// Der Token, mit dem sich der Bot bei Discord anmeldet.
// Es muss ein BOT-Token sein (Benutzer-Tokens funktionieren nicht).
// Wenn du nicht weißt, wie du einen bekommst, siehe diese Anleitung (Englisch):
// https://github.com/jagrosh/MusicBot/wiki/Getting-a-Bot-Token
token = "BOT_TOKEN_HERE"

// Der Bot-Besitzer. Das muss die Discord-Benutzer-ID des Besitzers sein (eine 17-20-stellige Zahl).
// Guide: https://github.com/jagrosh/MusicBot/wiki/Finding-Your-User-ID
owner = OWNER_ID_HERE

// Das Befehlspräfix des Bots. Wird für Präfix-Befehle benötigt.
// Mit `!` wird der Befehl `play` zum Beispiel zu `!play`.
// Das Standardpräfix ist die Erwähnung des Bots (z. B. `@BotName play`).
// Hinweis: Slash-Befehle (/play) funktionieren unabhängig vom Präfix immer.
prefix = "@mention"

// Ein zweites (alternatives) Präfix. Wenn gesetzt, kann es zusammen mit dem obigen Präfix verwendet werden.
// Mit `NONE` wird das zweite Präfix deaktiviert.
// Standard: `NONE`
altprefix = "NONE"

// Was der Bot in seiner Statuszeile (dem „Spielt“-Teil) anzeigt.
// Du kannst "Playing ...", "Listening to ..." oder "Watching ..." schreiben
// (... durch beliebigen Text ersetzen). Jeder andere Text wird als benutzerdefinierter Status angezeigt.
// `DEFAULT` verwendet den Standard.
// `NONE` zeigt nichts an.
game = "DEFAULT"

// Der Online-Status des Bots.
// Optionen: `ONLINE`, `IDLE` (abwesend), `DND` (nicht stören), `INVISIBLE` (unsichtbar)
// Standard: `ONLINE`
status = ONLINE

// Bei `true` zeigt der Bot den aktuellen Titel in seiner Statuszeile an.
// Das funktioniert nur, während der Bot auf einem einzigen Server Musik spielt
// (er wird angezeigt, wenn er gleichzeitig nur auf einem Server spielt, auch wenn er auf mehreren Servern ist).
// Standard: `true`. Zum Deaktivieren auf `false` setzen.
songinstatus = true

// Emojis in Befehlsantworten.
success = "🎶"
warning = "💡"
error = "🚫"
loading = "⌚"
searching = "🔎"

// Name des Befehls, der die Hilfe anzeigt.
// Bei Präfix `!` und dem Wert `befehle` zeigt z. B. `!befehle` die Hilfe an.
// Standard: `help`
help = "help"

// Bei `true` wird die Hilfe als Direktnachricht (DM) gesendet.
// Standard: `true`
helptodm = true

// Bei `true` zeigt der Befehl `nowplaying` oben rechts das YouTube-Vorschaubild bzw. das Spotify-Albumcover.
// Hinweis: Bei `true` wird die `nowplaying`-Nachricht nicht automatisch aktualisiert
// (automatische Updates sind aus, weil das Bild sonst bei jedem Update neu geladen würde).
// Standard: `true`. Zum Deaktivieren auf `false` setzen.
npimages = true

// Bei `true` wird der Wiedergabestatus im Spitznamen des Bots angezeigt.
// Standard: `true`. Zum Deaktivieren auf `false` setzen.
changenickname = true


// Bei `true` zeigt der Hilfebefehl einen Einladungslink zum offiziellen Cosgy-Dev-Discord-Server.
officialinvite = false

// Bei `true` verlässt der Bot den Sprachkanal auch dann nicht, wenn alle Titel gespielt sind.
// Im Kanal zu bleiben braucht zusätzliche Bandbreite; bei schwacher Verbindung nicht aktivieren.
// Standard: `false`. Zum Aktivieren auf `true` setzen.
stayinchannel = false

// Bei `pausenousers` = `true` pausiert der Bot, wenn alle den Sprachkanal verlassen.
// Mit `resumejoined` = `true` geht es automatisch weiter, sobald wieder jemand beitritt.
// Mit `stopnousers` = `true` stoppt der Bot ganz, statt zu pausieren, wenn alle gehen.
//
// Sind `pausenousers` und `stopnousers` beide `true`, gilt `pausenousers`.
//
// Alle drei sind standardmäßig `false`. Zum Aktivieren auf `true` setzen.
pausenousers = false
resumejoined = false
stopnousers = false

// Auf `true` setzen, um Niconico (eine japanische Videoseite) zu unterstützen.
// Hinweis: Die Niconico-Unterstützung ist experimentell und kann Probleme haben.
// Standard: `false`
useniconico = false

// Wenn useniconico `true` ist, gib die E-Mail-Adresse und das Passwort deines Niconico-Kontos ein.
// nicomail: E-Mail-Adresse des Niconico-Kontos
// nicopass: Passwort des Niconico-Kontos
nicomail = "example@hoge.jp"
nicopass = "0123456789"

// Wenn dein Niconico-Konto die Zwei-Faktor-Authentifizierung nutzt, gib den geheimen Schlüssel ein.
// Leer lassen, wenn sie nicht aktiviert ist.
// Mit dem richtigen Schlüssel wird der Code beim Abspielen automatisch erzeugt und verwendet.
nicotwofactor=""

// Wenn du YouTube angemeldet nutzen möchtest, gib hier die Zugangsdaten ein.
// YouTube funktioniert auch ohne Anmeldung; Premium-Videos brauchen jedoch ein Premium-Konto.
// Ist die Zwei-Faktor-Authentifizierung aktiv, verwende ein App-Passwort.
ytemail = ""
ytpass = ""

// Bei YouTube mit einem Google-Konto anmelden (für altersbeschränkte / „Anmeldung erforderlich“-Videos).
// Auf true setzen und den Bot neu starten. In der Konsole erscheint ein Code: öffne https://www.google.com/device,
// gib den Code ein und wähle das Konto. Der Bot erkennt die Anmeldung selbst und speichert den Token
// in youtube-oauth.txt; bei späteren Starts ist keine erneute Anmeldung nötig.
// Normale Videos werden weiterhin ohne Konto abgespielt; das Konto wird nur genutzt, wenn andere Methoden scheitern.
// WICHTIG: Ein separates Konto verwenden, nicht dein Hauptkonto. Für Videos ab 18 muss das Konto altersverifiziert sein.
// Standard: `false`
youtubeoauth2 = false

// Refresh-Token. Leer lassen, um youtube-oauth.txt zu verwenden.
youtubeoauth2refreshtoken = ""

// Wer soll informiert werden, wenn ein Titel gar nicht abspielbar ist (Altersbeschränkung, privates Video …)?
// "none"    = niemand; es wird nur in die Konsole geschrieben und der Bot geht zum nächsten Titel (Standard)
// "dm"      = eine Direktnachricht (DM) nur an die Person, die den Titel angefragt hat
// "channel" = eine für alle sichtbare Nachricht im Kanal des letzten Befehls
failnotice = "none"

// TITEL-CACHE (cache-Ordner)
// Titel, die YouTube nicht liefert, werden mit yt-dlp heruntergeladen und im cache-Ordner gespeichert,
// damit sie bei erneuter Anfrage sofort spielen. Überschreitet der Ordner diese Größe (MB), werden die am längsten
// nicht gespielten Titel gelöscht (bis der Ordner bei 80 % des Limits ist). Ein Titel hat ca. 3-5 MB; 1024 MB ≈ 250 Titel.
// Mindestens 100. Standard: 1024
cachelimitmb = 1024

// Für den yt-dlp-Ersatz: Legst du eine "cookies.txt" (Netscape-Format) in den Bot-Ordner,
// meldet sich yt-dlp mit diesem Konto bei YouTube an. Keine Einstellung nötig; die Datei genügt.

// ---------------------------------------------------------------------------
// SPOTIFY
// ---------------------------------------------------------------------------
// Spotify-Links (Titel, Album, Playlist, Künstler) können mit /play, !play und /spotify abgespielt werden.
// Da Spotify keine Audiodateien liefert, werden die Titelinfos von Spotify gelesen und derselbe Titel
// auf YouTube Music / YouTube gesucht und von dort abgespielt.
//
// Die folgenden Schlüssel sind OPTIONAL:
//  - Leer gelassen funktioniert Spotify trotzdem (die öffentliche Spotify-Seite wird verwendet).
//  - Ausgefüllt werden einzelne Titel und Alben über die offizielle API gelesen; dank ISRC-Code
//    wird die RICHTIGE Aufnahme auf YouTube viel genauer gefunden. Auch die Suche `spsearch:` wird aktiviert.
//
// Schlüssel bekommen: https://developer.spotify.com/dashboard → "Create app"
//   (als Redirect URI kannst du https://example.com eingeben; "Web API" auswählen)
//   "Client ID" und "Client secret" von der Settings-Seite der App hier einfügen.
// Hinweis: Seit 2026 verlangt Spotify für Apps im Development Mode, dass der App-Besitzer
//   Spotify Premium hat. Ohne Premium diese Felder leer lassen.
// Hinweis: Die Embed-Seite liefert höchstens 100 Titel einer Playlist.
spclient = ""
spsecret = ""

// Maximale Abspieldauer eines Titels (Sekunden).
// 0 oder weniger bedeutet kein Limit.
// Das Limit gilt unabhängig davon, woher der Titel geladen wird.
// Standard: `0`
maxtime = 0

// Nach wie vielen Sekunden der Bot den Sprachkanal verlässt, wenn er allein ist.
// Beim Verlassen wird die Warteschlange zurückgesetzt. 0 oder weniger deaktiviert die Funktion.
alonetimeuntilstop = 0

// Ob die Titel der Warteschlange gespeichert werden, wenn der Bot den Sprachkanal automatisch verlässt.
// Bei `true` wird die Warteschlange gespeichert (später mit einem leeren `/play` wiederherstellen). Standard: `false`
autostopqueuesave = false

// Ordner, in dem Playlists gespeichert werden (relativer oder absoluter Pfad).
// Standard: `Playlists`
playlistsfolder = Playlists

// Ordner, in dem persönliche Listen (mylist) gespeichert werden (relativer oder absoluter Pfad).
// Standard: `Mylists`

mylistfolder = Mylists

publistfolder = Publist

// Soll der Besitzer per DM benachrichtigt werden, wenn eine neue Version erscheint, während der Bot läuft?
// `true` zum Benachrichtigen, `false` sonst.
// Standard: `true`
updatealerts = true

// Sollen die von Benutzern ausgeführten Befehle protokolliert werden?
// `true` zum Protokollieren, `false` sonst.
auditcommands = false

// Den Befehl `invite` aktivieren?
// Zum Aktivieren auf `true` setzen. Standard: `false`
useinvitecommand = false

// Hinweis: Songtexte werden zuerst bei LRCLIB (lrclib.net) gesucht; die Seite unten ist nur ein Ersatz.
// Ersatzseite für die Songtextsuche.
// Optionen: `"AZ Lyrics"`, `"Genius"`, `"MusicMatch"`, `"LyricsFreak"`
// Derzeit werden `"AZ Lyrics"` oder `"MusicMatch"` empfohlen.
// `"Genius"` liefert manchmal Nicht-Song-Ergebnisse, daher wird der gewünschte Text evtl. nicht gefunden.
// Für einen neuen Anbieter siehe das JLyrics-Repository: https://github.com/jagrosh/JLyrics
// Standard: `"MusicMatch"`
lyrics.default = "MusicMatch"

// Du kannst zusätzliche Aliasse für Befehle festlegen. Mehrere mit Kommas trennen.
//
// Beispiel 1: Der Befehl "play" soll auch als "p" funktionieren:
// play = [ p ]
//
// Beispiel 2: Der Befehl "search" soll auch als "yts" und "find" funktionieren:
// search = [ yts, find ]

aliases {
  // Allgemeine Befehle
  help = []
  cache = []
  settings = [status]
  serverinfo = []

  // Musikbefehle
  lyrics = []
  nowplaying = [np, current]
  play = [p]
  playlists = [pls]
  queue = [list]
  remove = [delete]
  scsearch = []
  ncsearch = [niconicosearch, nicosearch, ncs, nicos]
  search = [ytsearch]
  shuffle = []
  skip = [voteskip, s]

  // Admin-Befehle
  prefix = [setprefix]
  setdj = []
  setskip = [setskippercent, skippercent, setskipratio]
  settc = []
  setvc = []

  // DJ-Befehle
  forceremove = [forcedelete, modremove, moddelete, modelete]
  forceskip = [modskip, fs]
  movetrack = [move]
  pause = []
  playnext = []
  repeat = [loop]
  skipto = [jumpto]
  stop = []
  volume = [vol]
  spotify = [sp]
}

// `transforms` wandelt bestimmte Eingaben in andere Eingaben um. Der Nutzen ist begrenzt;
// theoretisch lassen sich damit Erlaubt-/Sperrlisten bauen, bestimmte Quellen indirekt laden
// und eigene Verarbeitung umsetzen.
//
// Die Einrichtung ist nicht einfach; dazu musst du den Code lesen, um zu verstehen, wie es funktioniert
// und welche Felder nötig sind.
// Diese Funktion wird evtl. künftig ganz entfernt, wenn es eine bessere Methode gibt.
transforms = {}

// Bei `true` wird der Befehl `eval` für den Bot-Besitzer aktiviert.
// Damit lässt sich beliebiger Code mit dem Konto des Bots ausführen.
//
// WARNUNG:
// Dieser Befehl ist sehr gefährlich.
// Wer ihn ohne volles Verständnis nutzt, kann auf dem Discord-Server oder dem Computer ernste Probleme verursachen.
// Aktiviere diesen Befehl nur, wenn du genau weißt, was du tust.
//
// Wenn dir jemand sagt, du sollst ihn aktivieren, und du nicht weißt, wofür er ist: tu es nicht.
// Wahrscheinlich versucht diese Person, dich zu etwas Gefährlichem zu verleiten.
// Standard: `false`. Nur auf `true` setzen, wenn du die Risiken verstehst.
eval = false
