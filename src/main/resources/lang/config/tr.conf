//______________________________________________________________
//                     ========================
//                      JMusicBot-ML Ayarları  [lang:tr]
//                     ========================
//
// // ile başlayan satırlar yok sayılır (açıklama satırıdır).
// token ve owner ayarlarını mutlaka yapmalısınız.
// Diğer tüm ayarların varsayılan değeri vardır.
// Bu dosyayı Notepad++, VS Code veya nano gibi bir düzenleyiciyle düzenlemeniz önerilir.
//‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾

// Ayar dosyasının sürümü. Bot açılırken dosyayı otomatik güncellemek için kullanılır.
// Bu değeri elle değiştirmeyin.
configversion = 7

// Botun dili. Seçenekler: "en" (English), "tr" (Türkçe), "ja" (日本語), "de" (Deutsch), "es" (Español), "ru" (Русский)
// Değiştirip botu yeniden başlatın; bu dosyanın açıklamaları da seçilen dile çevrilir.
// Slash komut açıklamaları her kullanıcıya kendi Discord dilinde gösterilir.
language = "tr"

// Botun Discord'a giriş yapmak için kullanacağı token.
// Bu bir BOT tokeni olmalıdır (kullanıcı tokenleri çalışmaz).
// Tokeni nasıl alacağınızı bilmiyorsanız şu rehbere bakın (İngilizce):
// https://github.com/jagrosh/MusicBot/wiki/Getting-a-Bot-Token
token = "BOT_TOKEN_BURAYA"

// Botun sahibi. Sahibin Discord kullanıcı kimliği (17-20 haneli sayı) olmalıdır.
// Rehber (İngilizce): https://github.com/jagrosh/MusicBot/wiki/Finding-Your-User-ID
owner = SAHIP_ID_BURAYA

// Botun komut öneki (prefix). Önekli komutları kullanmak için gerekir.
// Örneğin `!` yaparsanız `play` komutu `!play` (veya Türkçe adıyla `!çal`) olur.
// Varsayılan önek botun etiketidir (ör. `@BotAdı play`).
// Not: Slash komutları (/play, /oynat) önekten bağımsız olarak her zaman çalışır.
prefix = "@mention"

// İkinci (yedek) önek. Ayarlarsanız yukarıdaki önekle birlikte bu önek de kullanılabilir.
// `NONE` veya `YOK` yazarsanız ikinci önek kapatılır.
// Varsayılan: `YOK`
altprefix = "YOK"

// Botun durum satırında (oynuyor kısmında) ne yazacağını ayarlar.
// "Playing ...", "Listening to ..." veya "Watching ..." biçiminde yazabilirsiniz
// (... yerine istediğiniz metni yazın). Bunlar dışındaki metinler özel durum olarak gösterilir.
// Varsayılanı kullanmak için `DEFAULT` yazın.
// Hiçbir şey göstermemek için `NONE` veya `YOK` yazın.
game = "DEFAULT"

// Botun çevrimiçi durumu.
// Seçenekler: `ONLINE` (çevrimiçi), `IDLE` (boşta), `DND` (rahatsız etmeyin), `INVISIBLE` (görünmez)
// Varsayılan: `ONLINE`
status = ONLINE

// `true` yapılırsa bot, çalan şarkıyı durum satırında gösterir.
// Bu özellik yalnızca bot tek bir sunucuda müzik çalarken çalışır
// (bot birden fazla sunucuda olsa bile aynı anda tek sunucuda çalıyorsa gösterilir).
// Varsayılan: `true`. Kapatmak için `false` yapın.
songinstatus = true

// Komut yanıtlarında kullanılan emojiler.
success = "🎶"
warning = "💡"
error = "🚫"
loading = "⌚"
searching = "🔎"

// Yardım mesajını gösteren komutun adı.
// Örneğin önek `!` ve bu değer `komutlar` ise `!komutlar` yazınca yardım gösterilir.
// Varsayılan: `help` (Türkçe adı `yardım` her zaman çalışır)
help = "help"

// `true` ise yardım mesajı özel mesaj (DM) olarak gönderilir.
// Varsayılan: `true`
helptodm = true

// `true` ise `nowplaying` komutunda sağ üstte YouTube küçük resmi ya da Spotify albüm kapağı gösterilir.
// Not: `true` iken `nowplaying` mesajı otomatik olarak güncellenmez
// (her güncellemede resim yeniden yükleneceği için otomatik güncelleme kapatılır).
// Varsayılan: `true`. Kapatmak için `false` yapın.
npimages = true

// `true` ise botun takma adında çalma durumu gösterilir.
// Varsayılan: `true`. Kapatmak için `false` yapın.
changenickname = true


// `true` ise yardım komutunda Cosgy Dev resmi Discord sunucusunun davet linki gösterilir.
officialinvite = false

// `true` yapılırsa bot tüm şarkılar bittiğinde de ses kanalından çıkmaz.
// Kanalda kalmak ek bant genişliği kullanır; bağlantınız zayıfsa bu ayarı açmayın.
// Varsayılan: `false`. Açmak için `true` yapın.
stayinchannel = false

// `pausenousers` = `true` ise ses kanalındaki herkes çıktığında bot şarkıyı duraklatır.
// Biri tekrar kanala girdiğinde otomatik devam etmesini istiyorsanız `resumejoined` = `true` yapın.
// Herkes çıktığında duraklatmak yerine tamamen durdurmak için `stopnousers` = `true` yapın.
//
// `pausenousers` ve `stopnousers` ikisi birden `true` ise `pausenousers` geçerli olur.
//
// Üçünün de varsayılanı `false`'tur. Açmak için `true` yapın.
pausenousers = false
resumejoined = false
stopnousers = false

// Niconico (Japon video sitesi) desteğini açmak için `true` yapın.
// Not: Niconico desteği deneme aşamasındadır ve çeşitli sorunlar çıkabilir.
// Varsayılan: `false`
useniconico = false

// useniconico `true` ise Niconico hesabınızın e-posta adresini ve şifresini girin.
// nicomail: Niconico hesabının e-posta adresi
// nicopass: Niconico hesabının şifresi
nicomail = "example@hoge.jp"
nicopass = "0123456789"

// Niconico hesabınızda iki aşamalı doğrulama açıksa gizli anahtarı (secret key) girin.
// Açık değilse boş bırakın.
// Doğru anahtar girilirse çalarken doğrulama kodu otomatik üretilir ve giriş yapılır.
nicotwofactor=""

// YouTube'a giriş yaparak kullanmak istiyorsanız giriş bilgilerini buraya yazın.
// YouTube girişsiz de çalışır; ancak YouTube Premium'a özel videolar için Premium hesap gerekir.
// Hesabınızda iki aşamalı doğrulama açıksa uygulama şifresi kullanın.
ytemail = ""
ytpass = ""

// YouTube'a Google hesabıyla giriş (yaş sınırlı / "giriş gerekli" videolar için).
// true yapıp botu yeniden başlatın. Konsolda bir kod çıkar: https://www.google.com/device
// adresinde bu kodu girip hesabı seçin. Bot girişi kendisi algılar ve anahtarı
// youtube-oauth.txt dosyasına kaydeder; sonraki açılışlarda tekrar giriş gerekmez.
// Normal videolar yine hesapsız çalınır; hesap yalnızca diğer yöntemler başarısız olunca kullanılır.
// ÖNEMLİ: Ana hesabınızı değil, yan bir hesap kullanın. +18 videolar için hesabın yaşı doğrulanmış olmalı.
// Varsayılan: `false`
youtubeoauth2 = false

// Yenileme anahtarı (refresh token). Boş bırakın: youtube-oauth.txt kullanılır.
youtubeoauth2refreshtoken = ""

// Bir şarkı hiçbir yolla çalınamazsa (yaş sınırı, gizli video…) kim bilgilendirilsin?
// "none"    = kimse; yalnızca konsola yazılır, bot sıradaki şarkıya geçer (varsayılan)
// "dm"      = yalnızca şarkıyı isteyen kişiye özel mesaj (DM) gönderilir
// "channel" = son komutun yazıldığı kanala herkesin göreceği mesaj
failnotice = "none"

// ŞARKI ÖNBELLEĞİ (cache klasörü)
// YouTube'un vermediği şarkılar yt-dlp ile indirilir ve tekrar istendiğinde anında çalsın diye
// cache klasöründe saklanır. Klasör bu boyutu (MB) geçince en uzun süredir çalınmayan şarkılar
// silinir (klasör sınırın %80'ine inene kadar). Bir şarkı ortalama 3-5 MB'tır; 1024 MB ≈ 250 şarkı.
// En az 100. Varsayılan: 1024
cachelimitmb = 1024

// yt-dlp yedeği için: bot klasörüne "cookies.txt" (Netscape biçimi) koyarsanız
// yt-dlp YouTube'a o hesapla girer. Ayar gerekmez, dosyanın varlığı yeterlidir.

// ---------------------------------------------------------------------------
// SPOTIFY
// ---------------------------------------------------------------------------
// Spotify linkleri (şarkı, albüm, çalma listesi, sanatçı) /play, !play ve /spotify ile çalınabilir.
// Spotify ses dosyası vermediği için şarkı bilgileri Spotify'dan okunur ve aynı şarkı
// YouTube Music / YouTube'da bulunup oradan çalınır.
//
// Aşağıdaki anahtarlar İSTEĞE BAĞLIDIR:
//  - Boş bırakırsanız Spotify yine çalışır (Spotify'ın herkese açık sayfası kullanılır).
//  - Doldurursanız tek şarkı ve albümler resmi API ile okunur; ISRC kodu sayesinde
//    YouTube'da DOĞRU kayıt çok daha isabetli bulunur. `spsearch:` araması da açılır.
//
// Anahtar almak için: https://developer.spotify.com/dashboard → "Create app"
//   (Redirect URI olarak https://example.com yazabilirsiniz, "Web API" seçin)
//   Uygulamanın Settings sayfasındaki "Client ID" ve "Client secret" değerlerini buraya yapıştırın.
// Not: 2026'dan beri Spotify, Development Mode uygulamaları için uygulama sahibinin
//   Spotify Premium üyesi olmasını şart koşuyor. Premium yoksa alanları boş bırakın.
// Not: Embed sayfası bir çalma listesinden en fazla 100 şarkı verir.
spclient = ""
spsecret = ""

// Bir şarkının en uzun çalma süresi (saniye).
// 0 veya daha küçükse sınır yoktur.
// Bu sınır, şarkı nereden yüklenirse yüklensin uygulanır.
// Varsayılan: `0`
maxtime = 0

// Bot ses kanalında yalnız kalırsa kaç saniye sonra çıkacağını ayarlar.
// Çıkarken kuyruk sıfırlanır. 0 veya daha küçükse bu özellik kapalıdır.
alonetimeuntilstop = 0

// Bot ses kanalından otomatik çıkarken kuyruktaki şarkıların kaydedilip kaydedilmeyeceği.
// `true` ise kuyruk kaydedilir (sonra boş `/play` ile geri yüklenir). Varsayılan: `false`
autostopqueuesave = false

// Çalma listelerinin kaydedileceği klasör (göreli veya mutlak yol).
// Varsayılan: `Playlists`
playlistsfolder = Playlists

// Kişisel listelerin (mylist) kaydedileceği klasör (göreli veya mutlak yol).
// Varsayılan: `Mylists`

mylistfolder = Mylists

publistfolder = Publist

// Bot çalışırken yeni bir sürüm çıktığında sahibine DM ile haber verilsin mi?
// Haber vermek için `true`, vermemek için `false`.
// Varsayılan: `true`
updatealerts = true

// Kullanıcıların çalıştırdığı komutlar günlüğe (log) yazılsın mı?
// Yazmak için `true`, yazmamak için `false`.
auditcommands = false

// `invite` (davet) komutu açılsın mı?
// Açmak için `true` yapın. Varsayılan: `false`
useinvitecommand = false

// Not: Şarkı sözleri önce LRCLIB (lrclib.net) servisinden aranır; aşağıdaki site yalnızca yedektir.
// Şarkı sözlerinin aranacağı yedek site.
// Seçenekler: `"AZ Lyrics"`, `"Genius"`, `"MusicMatch"`, `"LyricsFreak"`
// Şimdilik `"AZ Lyrics"` veya `"MusicMatch"` önerilir.
// `"Genius"` bazen şarkı dışı sonuçlar gösterdiği için istenen sözler bulunmayabilir.
// Yeni sağlayıcı geliştirmek isterseniz JLyrics deposuna bakın: https://github.com/jagrosh/JLyrics
// Varsayılan: `"MusicMatch"`
lyrics.default = "MusicMatch"

// Komutlara ek takma adlar (alias) tanımlayabilirsiniz. Birden fazlası virgülle ayrılır.
// Not: Her komutun Türkçe adı zaten yerleşik olarak çalışır (ör. !çal, !geç, !kuyruk, /oynat).
//
// Örnek 1: "play" komutu "p" ile de çalışsın:
// play = [ p ]
//
// Örnek 2: "search" komutu "yts" ve "find" ile de çalışsın:
// search = [ yts, find ]

aliases {
  // Genel komutlar
  help = []
  cache = []
  settings = [status]
  serverinfo = []

  // Müzik komutları
  lyrics = []
  nowplaying = [np, current]
  play = [p]
  playlists = [pls]
  queue = [list]
  remove = [delete]
  scsearch = []
  ncsearch = [niconicosearch, nicosearch, ncs, nicos]
  search = [ytsearch]
  shuffle = []
  skip = [voteskip, s]

  // Yönetici komutları
  prefix = [setprefix]
  setdj = []
  setskip = [setskippercent, skippercent, setskipratio]
  settc = []
  setvc = []

  // DJ komutları
  forceremove = [forcedelete, modremove, moddelete, modelete]
  forceskip = [modskip, fs]
  movetrack = [move]
  pause = []
  playnext = []
  repeat = [loop]
  skipto = [jumpto]
  stop = []
  volume = [vol]
  spotify = [sp]
}

// `transforms`, belirli girdileri başka türde girdilere dönüştürmek için kullanılır. Kullanım alanı sınırlıdır;
// teoride beyaz/kara liste oluşturmak, belirli kaynakları dolaylı yoldan yüklemek
// ve özel işlemler yapmak mümkündür.
//
// Kurulumu kolay değildir; kullanmak istiyorsanız kodu inceleyip nasıl çalıştığını
// ve hangi alanların gerektiğini anlamanız gerekir.
// Daha iyi bir yöntem bulunursa bu özellik ileride tamamen kaldırılabilir.
transforms = {}

// `true` yapılırsa bot sahibi için `eval` komutu açılır.
// Bu komut botun hesabıyla istenen herhangi bir kodu çalıştırmanızı sağlar.
//
// UYARI:
// Bu komut çok tehlikelidir.
// Tam olarak anlamadan kullanırsanız Discord sunucunuzda veya bilgisayarınızda ciddi sorunlara yol açabilir.
// Ne yaptığınızı tam olarak bilmiyorsanız bu komutu açmayın.
//
// Biri size bunu açmanızı söylüyorsa ve ne işe yaradığını bilmiyorsanız, açmayın.
// Büyük ihtimalle sizi tehlikeli bir şey yapmaya yönlendirmeye çalışıyordur.
// Varsayılan: `false`. Riskleri anlayarak açmak için `true` yapın.
eval = false
