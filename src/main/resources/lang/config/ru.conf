//______________________________________________________________
//                     ========================
//                      Настройки JMusicBot-ML  [lang:ru]
//                     ========================
//
// Строки, начинающиеся с //, игнорируются (это комментарии).
// Параметры token и owner ОБЯЗАТЕЛЬНО нужно заполнить.
// У всех остальных настроек есть значения по умолчанию.
// Рекомендуется редактировать этот файл в редакторе вроде Notepad++, VS Code или nano.
//‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾

// Версия этого файла. Используется для автоматического обновления файла при запуске бота.
// Не меняйте это значение.
configversion = 7

// Язык бота. Варианты: "en" (English), "tr" (Türkçe), "ja" (日本語), "de" (Deutsch), "es" (Español), "ru" (Русский)
// Измените и перезапустите бота; комментарии в этом файле тоже будут переведены на этот язык.
// Описания слэш-команд каждый пользователь видит на языке своего Discord.
language = "ru"

// Токен, с которым бот входит в Discord.
// Это должен быть токен БОТА (токены пользователей не работают).
// Если не знаете, как его получить, см. руководство (на английском):
// https://github.com/jagrosh/MusicBot/wiki/Getting-a-Bot-Token
token = "BOT_TOKEN_HERE"

// Владелец бота. Это должен быть ID пользователя Discord владельца (число из 17-20 цифр).
// Guide: https://github.com/jagrosh/MusicBot/wiki/Finding-Your-User-ID
owner = OWNER_ID_HERE

// Префикс команд бота. Нужен для команд с префиксом.
// Например, с `!` команда `play` становится `!play`.
// Префикс по умолчанию — упоминание бота (напр. `@ИмяБота play`).
// Примечание: слэш-команды (/play) работают всегда, независимо от префикса.
prefix = "@mention"

// Второй (запасной) префикс. Если задан, его можно использовать вместе с префиксом выше.
// Укажите `NONE`, чтобы отключить второй префикс.
// По умолчанию: `NONE`
altprefix = "NONE"

// Что бот показывает в строке статуса (часть «Играет в»).
// Можно написать "Playing ...", "Listening to ..." или "Watching ..."
// (вместо ... — любой текст). Любой другой текст показывается как пользовательский статус.
// `DEFAULT` — использовать значение по умолчанию.
// `NONE` — ничего не показывать.
game = "DEFAULT"

// Сетевой статус бота.
// Варианты: `ONLINE` (в сети), `IDLE` (неактивен), `DND` (не беспокоить), `INVISIBLE` (невидимый)
// По умолчанию: `ONLINE`
status = ONLINE

// Если `true`, бот показывает текущий трек в строке статуса.
// Работает, только пока бот играет музыку на одном сервере
// (показывается, если в данный момент он играет только на одном сервере, даже если состоит в нескольких).
// По умолчанию: `true`. Чтобы выключить, укажите `false`.
songinstatus = true

// Эмодзи в ответах на команды.
success = "🎶"
warning = "💡"
error = "🚫"
loading = "⌚"
searching = "🔎"

// Имя команды, которая показывает справку.
// Например, с префиксом `!` и значением `команды` справку покажет `!команды`.
// По умолчанию: `help`
help = "help"

// Если `true`, справка отправляется личным сообщением (ЛС).
// По умолчанию: `true`
helptodm = true

// Если `true`, команда `nowplaying` показывает справа вверху миниатюру YouTube или обложку альбома Spotify.
// Примечание: при `true` сообщение `nowplaying` не обновляется автоматически
// (автообновление отключается, так как картинка загружалась бы заново при каждом обновлении).
// По умолчанию: `true`. Чтобы выключить, укажите `false`.
npimages = true

// Если `true`, состояние воспроизведения показывается в никнейме бота.
// По умолчанию: `true`. Чтобы выключить, укажите `false`.
changenickname = true


// Если `true`, команда справки показывает ссылку-приглашение на официальный Discord-сервер Cosgy Dev.
officialinvite = false

// Если `true`, бот не выходит из голосового канала, даже когда все треки закончились.
// Нахождение в канале расходует дополнительный трафик; при слабом соединении не включайте.
// По умолчанию: `false`. Чтобы включить, укажите `true`.
stayinchannel = false

// При `pausenousers` = `true` бот ставит трек на паузу, когда все выходят из голосового канала.
// При `resumejoined` = `true` воспроизведение продолжится автоматически, когда кто-то снова зайдёт.
// При `stopnousers` = `true` бот полностью останавливается вместо паузы, когда все выходят.
//
// Если `pausenousers` и `stopnousers` оба `true`, действует `pausenousers`.
//
// Все три по умолчанию `false`. Чтобы включить, укажите `true`.
pausenousers = false
resumejoined = false
stopnousers = false

// Укажите `true`, чтобы включить поддержку Niconico (японский видеосайт).
// Примечание: поддержка Niconico экспериментальная и может работать с ошибками.
// По умолчанию: `false`
useniconico = false

// Если useniconico = `true`, укажите e-mail и пароль аккаунта Niconico.
// nicomail: e-mail аккаунта Niconico
// nicopass: пароль аккаунта Niconico
nicomail = "example@hoge.jp"
nicopass = "0123456789"

// Если в аккаунте Niconico включена двухфакторная аутентификация, укажите секретный ключ.
// Если не включена, оставьте пустым.
// С правильным ключом код подтверждения создаётся и используется автоматически при воспроизведении.
nicotwofactor=""

// Если хотите пользоваться YouTube с входом в аккаунт, укажите данные здесь.
// YouTube работает и без входа; но для видео только для Premium нужен аккаунт Premium.
// Если в аккаунте включена двухфакторная аутентификация, используйте пароль приложения.
ytemail = ""
ytpass = ""

// Вход в YouTube через аккаунт Google (для видео с возрастным ограничением / «требуется вход»).
// Укажите true и перезапустите бота. В консоли появится код: откройте https://www.google.com/device,
// введите код и выберите аккаунт. Бот сам обнаружит вход и сохранит токен
// в youtube-oauth.txt; при следующих запусках входить заново не нужно.
// Обычные видео по-прежнему воспроизводятся без аккаунта; аккаунт используется, только если другие способы не сработали.
// ВАЖНО: используйте отдельный аккаунт, а не основной. Для видео 18+ возраст аккаунта должен быть подтверждён.
// По умолчанию: `false`
youtubeoauth2 = false

// Refresh-токен. Оставьте пустым, чтобы использовать youtube-oauth.txt.
youtubeoauth2refreshtoken = ""

// Кого уведомлять, если трек вообще не удаётся воспроизвести (возрастное ограничение, закрытое видео…)?
// "none"    = никого; только запись в консоль, бот переходит к следующему треку (по умолчанию)
// "dm"      = личное сообщение (ЛС) только тому, кто запросил трек
// "channel" = сообщение, видимое всем, в канале последней команды
failnotice = "none"

// КЭШ ТРЕКОВ (папка cache)
// Треки, которые YouTube не отдаёт, загружаются через yt-dlp и хранятся в папке cache,
// чтобы при повторном запросе играть сразу. Когда папка превышает этот размер (МБ), удаляются треки,
// которые дольше всего не играли (пока папка не уменьшится до 80 % лимита). Трек весит около 3-5 МБ; 1024 МБ ≈ 250 треков.
// Минимум 100. По умолчанию: 1024
cachelimitmb = 1024

// Для резервного способа yt-dlp: если положить "cookies.txt" (формат Netscape) в папку бота,
// yt-dlp будет входить в YouTube с этим аккаунтом. Настройка не нужна — достаточно наличия файла.

// ---------------------------------------------------------------------------
// SPOTIFY
// ---------------------------------------------------------------------------
// Ссылки Spotify (трек, альбом, плейлист, исполнитель) можно воспроизводить через /play, !play и /spotify.
// Spotify не отдаёт аудио, поэтому данные трека читаются из Spotify, а тот же трек
// ищется на YouTube Music / YouTube и воспроизводится оттуда.
//
// Ключи ниже НЕОБЯЗАТЕЛЬНЫ:
//  - Если оставить их пустыми, Spotify всё равно работает (используется публичная страница Spotify).
//  - Если заполнить, отдельные треки и альбомы читаются через официальный API; благодаря коду ISRC
//    НУЖНАЯ запись находится на YouTube гораздо точнее. Также включается поиск `spsearch:`.
//
// Получить ключи: https://developer.spotify.com/dashboard → "Create app"
//   (в качестве Redirect URI можно указать https://example.com; выберите "Web API")
//   Вставьте сюда "Client ID" и "Client secret" со страницы Settings приложения.
// Примечание: с 2026 года Spotify требует, чтобы у владельца приложения в Development Mode
//   была подписка Spotify Premium. Если Premium нет, оставьте поля пустыми.
// Примечание: встраиваемая страница отдаёт не более 100 треков плейлиста.
spclient = ""
spsecret = ""

// Максимальная длительность воспроизведения трека (секунды).
// 0 или меньше — без ограничения.
// Ограничение действует независимо от того, откуда загружен трек.
// По умолчанию: `0`
maxtime = 0

// Через сколько секунд бот выходит из голосового канала, если остался один.
// При выходе очередь сбрасывается. 0 или меньше отключает функцию.
alonetimeuntilstop = 0

// Сохранять ли треки очереди, когда бот автоматически выходит из голосового канала.
// При `true` очередь сохраняется (восстановить её можно пустой командой `/play`). По умолчанию: `false`
autostopqueuesave = false

// Папка для плейлистов (относительный или абсолютный путь).
// По умолчанию: `Playlists`
playlistsfolder = Playlists

// Папка для личных списков (mylist) (относительный или абсолютный путь).
// По умолчанию: `Mylists`

mylistfolder = Mylists

publistfolder = Publist

// Уведомлять владельца в ЛС о выходе новой версии, пока бот работает?
// `true` — уведомлять, `false` — нет.
// По умолчанию: `true`
updatealerts = true

// Записывать ли в журнал команды, выполненные пользователями?
// `true` — записывать, `false` — нет.
auditcommands = false

// Включить команду `invite`?
// Чтобы включить, укажите `true`. По умолчанию: `false`
useinvitecommand = false

// Примечание: тексты песен сначала ищутся на LRCLIB (lrclib.net); сайт ниже — только запасной вариант.
// Запасной сайт для поиска текстов песен.
// Варианты: `"AZ Lyrics"`, `"Genius"`, `"MusicMatch"`, `"LyricsFreak"`
// Сейчас рекомендуются `"AZ Lyrics"` или `"MusicMatch"`.
// `"Genius"` иногда выдаёт результаты, не связанные с песнями, поэтому нужный текст может не найтись.
// Чтобы написать новый источник, см. репозиторий JLyrics: https://github.com/jagrosh/JLyrics
// По умолчанию: `"MusicMatch"`
lyrics.default = "MusicMatch"

// Можно задать дополнительные псевдонимы команд. Несколько — через запятую.
//
// Пример 1: команда "play" также работает как "p":
// play = [ p ]
//
// Пример 2: команда "search" также работает как "yts" и "find":
// search = [ yts, find ]

aliases {
  // Общие команды
  help = []
  cache = []
  settings = [status]
  serverinfo = []

  // Музыкальные команды
  lyrics = []
  nowplaying = [np, current]
  play = [p]
  playlists = [pls]
  queue = [list]
  remove = [delete]
  scsearch = []
  ncsearch = [niconicosearch, nicosearch, ncs, nicos]
  search = [ytsearch]
  shuffle = []
  skip = [voteskip, s]

  // Команды администратора
  prefix = [setprefix]
  setdj = []
  setskip = [setskippercent, skippercent, setskipratio]
  settc = []
  setvc = []

  // Команды DJ
  forceremove = [forcedelete, modremove, moddelete, modelete]
  forceskip = [modskip, fs]
  movetrack = [move]
  pause = []
  playnext = []
  repeat = [loop]
  skipto = [jumpto]
  stop = []
  volume = [vol]
  spotify = [sp]
}

// `transforms` преобразует определённые входные данные в другие. Применение ограничено;
// теоретически с его помощью можно делать белые/чёрные списки, косвенно загружать некоторые источники
// и выполнять собственную обработку.
//
// Настроить это непросто: нужно прочитать код, чтобы понять, как он работает
// и какие поля требуются.
// Если найдётся способ получше, эта функция может быть полностью удалена.
transforms = {}

// Если `true`, для владельца бота включается команда `eval`.
// Она позволяет выполнить любой код от имени аккаунта бота.
//
// ВНИМАНИЕ:
// Эта команда очень опасна.
// Использование без полного понимания может вызвать серьёзные проблемы на вашем Discord-сервере или компьютере.
// Не включайте её, если не знаете точно, что делаете.
//
// Если кто-то просит её включить, а вы не знаете, для чего она, — не включайте.
// Скорее всего, вас пытаются обманом заставить сделать что-то опасное.
// По умолчанию: `false`. Указывайте `true`, только если понимаете риски.
eval = false
