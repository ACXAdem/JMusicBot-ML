//______________________________________________________________
//                     ========================
//                      JMusicBot-ML 設定  [lang:ja]
//                     ========================
//
// // で始まる行は無視されます（コメント行）。
// token と owner は必ず設定してください。
// それ以外の設定にはすべて初期値があります。
// このファイルは Notepad++、VS Code、nano などのエディターで編集することをおすすめします。
//‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾

// このファイルのバージョン。起動時にファイルを自動更新するために使われます。
// この値は変更しないでください。
configversion = 7

// ボットの言語。選択肢: "en" (English), "tr" (Türkçe), "ja" (日本語), "de" (Deutsch), "es" (Español), "ru" (Русский)
// 変更してボットを再起動すると、このファイルのコメントもその言語に翻訳されます。
// スラッシュコマンドの説明は、各ユーザーのDiscordの言語で表示されます。
language = "ja"

// ボットがDiscordにログインするためのトークン。
// BOTトークンである必要があります（ユーザートークンは使えません）。
// 取得方法がわからない場合は、このガイド（英語）を参照してください:
// https://github.com/jagrosh/MusicBot/wiki/Getting-a-Bot-Token
token = "BOT_TOKEN_HERE"

// ボットのオーナー。オーナーのDiscordユーザーID（17〜20桁の数字）である必要があります。
// Guide: https://github.com/jagrosh/MusicBot/wiki/Finding-Your-User-ID
owner = OWNER_ID_HERE

// ボットのコマンドプレフィックス。プレフィックスコマンドに必要です。
// 例えば `!` にすると、`play` コマンドは `!play` になります。
// 初期プレフィックスはボットへのメンションです（例: `@ボット名 play`）。
// 注意: スラッシュコマンド（/play）はプレフィックスに関係なく常に使えます。
prefix = "@mention"

// 2つ目（予備）のプレフィックス。設定すると上のプレフィックスと一緒に使えます。
// `NONE` にすると2つ目のプレフィックスは無効になります。
// 初期値: `NONE`
altprefix = "NONE"

// ボットのステータス欄（「プレイ中」の部分）に表示する内容。
// "Playing ..."、"Listening to ..."、"Watching ..." の形で書けます
// （... は任意の文字列）。それ以外の文字列はカスタムステータスとして表示されます。
// 初期値を使う場合は `DEFAULT` と書きます。
// 何も表示しない場合は `NONE` と書きます。
game = "DEFAULT"

// ボットのオンライン状態。
// 選択肢: `ONLINE`（オンライン）、`IDLE`（退席中）、`DND`（取り込み中）、`INVISIBLE`（オフライン表示）
// 初期値: `ONLINE`
status = ONLINE

// `true` にすると、再生中の曲をボットのステータス欄に表示します。
// ボットが1つのサーバーだけで音楽を再生しているときのみ機能します
// （複数のサーバーに参加していても、同時に1つのサーバーでだけ再生していれば表示されます）。
// 初期値: `true`。無効にするには `false` にします。
songinstatus = true

// コマンドの応答で使う絵文字。
success = "🎶"
warning = "💡"
error = "🚫"
loading = "⌚"
searching = "🔎"

// ヘルプを表示するコマンドの名前。
// 例えばプレフィックスが `!` でこの値が `commands` なら、`!commands` でヘルプが表示されます。
// 初期値: `help`
help = "help"

// `true` にすると、ヘルプをダイレクトメッセージ（DM）で送ります。
// 初期値: `true`
helptodm = true

// `true` にすると、`nowplaying` コマンドで右上にYouTubeのサムネイルまたはSpotifyのアルバムカバーを表示します。
// 注意: `true` のとき、`nowplaying` のメッセージは自動更新されません
// （更新のたびに画像が再読み込みされるため、自動更新は無効になります）。
// 初期値: `true`。無効にするには `false` にします。
npimages = true

// `true` にすると、再生状態をボットのニックネームに表示します。
// 初期値: `true`。無効にするには `false` にします。
changenickname = true


// `true` にすると、ヘルプコマンドでCosgy Dev公式Discordサーバーへの招待リンクを表示します。
officialinvite = false

// `true` にすると、すべての曲が終わってもボットはボイスチャンネルから退出しません。
// チャンネルに残ると余分な通信量を使います。回線が弱い場合は有効にしないでください。
// 初期値: `false`。有効にするには `true` にします。
stayinchannel = false

// `pausenousers` = `true` の場合、全員がボイスチャンネルから退出すると曲を一時停止します。
// 誰かが再び参加したときに自動で再開するには `resumejoined` = `true` にします。
// 全員が退出したときに一時停止ではなく完全に停止するには `stopnousers` = `true` にします。
//
// `pausenousers` と `stopnousers` が両方 `true` の場合は `pausenousers` が優先されます。
//
// 3つとも初期値は `false` です。有効にするには `true` にします。
pausenousers = false
resumejoined = false
stopnousers = false

// ニコニコ動画のサポートを有効にするには `true` にします。
// 注意: ニコニコ動画のサポートは試験的なもので、さまざまな問題が起こる可能性があります。
// 初期値: `false`
useniconico = false

// useniconico が `true` の場合、ニコニコ動画アカウントのメールアドレスとパスワードを入力してください。
// nicomail: ニコニコ動画アカウントのメールアドレス
// nicopass: ニコニコ動画アカウントのパスワード
nicomail = "example@hoge.jp"
nicopass = "0123456789"

// ニコニコ動画アカウントで二段階認証を有効にしている場合は、シークレットキーを入力してください。
// 有効にしていない場合は空欄のままにします。
// 正しいキーを入力すると、再生時に認証コードが自動生成されてログインします。
nicotwofactor=""

// YouTubeにログインして使いたい場合は、ここに認証情報を入力します。
// YouTubeはログインなしでも使えますが、Premium限定の動画にはPremiumアカウントが必要です。
// アカウントで二段階認証を有効にしている場合は、アプリパスワードを使用してください。
ytemail = ""
ytpass = ""

// GoogleアカウントでYouTubeにログインします（年齢制限付き / 「ログインが必要」な動画用）。
// true にしてボットを再起動すると、コンソールにコードが表示されます: https://www.google.com/device を開き、
// コードを入力してアカウントを選択します。ボットがログインを自動で検出し、トークンを
// youtube-oauth.txt に保存します。次回以降の起動では再ログインは不要です。
// 通常の動画は引き続きアカウントなしで再生されます。アカウントは他の方法が失敗したときだけ使われます。
// 重要: メインのアカウントではなく、別のアカウントを使用してください。18歳以上向けの動画には年齢確認済みのアカウントが必要です。
// 初期値: `false`
youtubeoauth2 = false

// リフレッシュトークン。空欄にすると youtube-oauth.txt が使われます。
youtubeoauth2refreshtoken = ""

// 曲がどの方法でも再生できない場合（年齢制限、非公開動画など）、誰に通知しますか？
// "none"    = 誰にも通知しない。コンソールに書くだけで、次の曲に進みます（初期値）
// "dm"      = 曲をリクエストした人にだけダイレクトメッセージ（DM）を送る
// "channel" = 最後にコマンドが使われたチャンネルに、全員が見られるメッセージを送る
failnotice = "none"

// 曲のキャッシュ（cache フォルダ）
// YouTubeが提供しない曲は yt-dlp でダウンロードされ、再度リクエストされたときにすぐ再生できるよう
// cache フォルダに保存されます。フォルダがこのサイズ（MB）を超えると、最も長く再生されていない曲から
// 削除されます（上限の80%になるまで）。1曲は約3〜5MB、1024MB ≈ 250曲です。
// 最小 100。初期値: 1024
cachelimitmb = 1024

// yt-dlp の代替方法用: ボットのフォルダに "cookies.txt"（Netscape形式）を置くと、
// yt-dlp はそのアカウントでYouTubeにログインします。設定は不要で、ファイルを置くだけで有効になります。

// ---------------------------------------------------------------------------
// SPOTIFY
// ---------------------------------------------------------------------------
// Spotifyのリンク（曲、アルバム、プレイリスト、アーティスト）は /play、!play、/spotify で再生できます。
// Spotifyは音声ファイルを提供しないため、曲の情報をSpotifyから読み取り、同じ曲を
// YouTube Music / YouTube で探してそこから再生します。
//
// 以下のキーは任意です:
//  - 空欄でもSpotifyは使えます（Spotifyの公開ページが使われます）。
//  - 入力すると、単曲とアルバムは公式APIで読み取られます。ISRCコードのおかげで
//    YouTube上の正しい音源がはるかに正確に見つかります。`spsearch:` 検索も使えるようになります。
//
// キーの取得: https://developer.spotify.com/dashboard → "Create app"
//   （Redirect URI には https://example.com を入力できます。"Web API" を選択してください）
//   アプリの Settings ページの "Client ID" と "Client secret" をここに貼り付けます。
// 注意: 2026年から、Spotifyは Development Mode のアプリについて、アプリの所有者が
//   Spotify Premium であることを必須にしています。Premium でない場合は空欄のままにしてください。
// 注意: 埋め込みページはプレイリストから最大100曲までしか返しません。
spclient = ""
spsecret = ""

// 1曲の最大再生時間（秒）。
// 0以下の場合は無制限です。
// この制限は、曲をどこから読み込んでも適用されます。
// 初期値: `0`
maxtime = 0

// ボイスチャンネルに1人だけになったとき、何秒後に退出するか。
// 退出時に再生待ちはリセットされます。0以下の場合、この機能は無効です。
alonetimeuntilstop = 0

// ボットが自動でボイスチャンネルから退出するとき、再生待ちの曲を保存するかどうか。
// `true` の場合、再生待ちが保存されます（後で引数なしの `/play` で復元）。初期値: `false`
autostopqueuesave = false

// プレイリストを保存するフォルダ（相対パスまたは絶対パス）。
// 初期値: `Playlists`
playlistsfolder = Playlists

// マイリストを保存するフォルダ（相対パスまたは絶対パス）。
// 初期値: `Mylists`

mylistfolder = Mylists

publistfolder = Publist

// ボットの稼働中に新しいバージョンが公開されたら、オーナーにDMで通知しますか？
// 通知する場合は `true`、しない場合は `false`。
// 初期値: `true`
updatealerts = true

// ユーザーが実行したコマンドをログに記録しますか？
// 記録する場合は `true`、しない場合は `false`。
auditcommands = false

// `invite` コマンドを有効にしますか？
// 有効にするには `true` にします。初期値: `false`
useinvitecommand = false

// 注意: 歌詞はまず LRCLIB（lrclib.net）で検索されます。下のサイトは予備です。
// 歌詞を検索する予備のサイト。
// 選択肢: `"AZ Lyrics"`、`"Genius"`、`"MusicMatch"`、`"LyricsFreak"`
// 現時点では `"AZ Lyrics"` または `"MusicMatch"` をおすすめします。
// `"Genius"` は曲以外の結果を返すことがあるため、目的の歌詞が見つからない場合があります。
// 新しいプロバイダーを開発する場合は JLyrics のリポジトリを参照してください: https://github.com/jagrosh/JLyrics
// 初期値: `"MusicMatch"`
lyrics.default = "MusicMatch"

// コマンドに追加のエイリアスを設定できます。複数ある場合はカンマで区切ります。
//
// 例1: "play" コマンドを "p" でも使えるようにする:
// play = [ p ]
//
// 例2: "search" コマンドを "yts" と "find" でも使えるようにする:
// search = [ yts, find ]

aliases {
  // 一般コマンド
  help = []
  cache = []
  settings = [status]
  serverinfo = []

  // 音楽コマンド
  lyrics = []
  nowplaying = [np, current]
  play = [p]
  playlists = [pls]
  queue = [list]
  remove = [delete]
  scsearch = []
  ncsearch = [niconicosearch, nicosearch, ncs, nicos]
  search = [ytsearch]
  shuffle = []
  skip = [voteskip, s]

  // 管理者コマンド
  prefix = [setprefix]
  setdj = []
  setskip = [setskippercent, skippercent, setskipratio]
  settc = []
  setvc = []

  // DJコマンド
  forceremove = [forcedelete, modremove, moddelete, modelete]
  forceskip = [modskip, fs]
  movetrack = [move]
  pause = []
  playnext = []
  repeat = [loop]
  skipto = [jumpto]
  stop = []
  volume = [vol]
  spotify = [sp]
}

// `transforms` は、特定の入力を別の種類の入力に変換するために使います。用途は限られていますが、
// 理論上は許可/拒否リストの作成や、特定のソースを間接的に読み込むこと、
// 独自の処理を行うことができます。
//
// 設定は簡単ではありません。使うにはコードを読んで、仕組みと
// 必要なフィールドを理解する必要があります。
// より良い方法が見つかれば、この機能は将来完全に削除される可能性があります。
transforms = {}

// `true` にすると、ボットのオーナー向けに `eval` コマンドが有効になります。
// このコマンドを使うと、ボットのアカウントで任意のコードを実行できます。
//
// 警告:
// このコマンドは非常に危険です。
// 十分に理解せずに使うと、Discordサーバーやパソコンに深刻な問題を引き起こす可能性があります。
// 何をしているのか正確にわかっている場合を除き、このコマンドを有効にしないでください。
//
// 誰かに有効にするよう言われても、それが何をするのかわからなければ有効にしないでください。
// その人はおそらく、あなたに危険なことをさせようとしています。
// 初期値: `false`。リスクを理解したうえでのみ `true` にしてください。
eval = false
