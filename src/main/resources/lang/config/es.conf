//______________________________________________________________
//                     ========================
//                      Ajustes de JMusicBot-ML  [lang:es]
//                     ========================
//
// Las líneas que empiezan por // se ignoran (son comentarios).
// Es OBLIGATORIO configurar token y owner.
// Todos los demás ajustes tienen valores predeterminados.
// Se recomienda editar este archivo con un editor como Notepad++, VS Code o nano.
//‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾

// Versión de este archivo. Se usa para actualizarlo automáticamente al iniciar el bot.
// No cambies este valor.
configversion = 7

// Idioma del bot. Opciones: "en" (English), "tr" (Türkçe), "ja" (日本語), "de" (Deutsch), "es" (Español), "ru" (Русский)
// Cámbialo y reinicia el bot; los comentarios de este archivo también se traducen a ese idioma.
// Las descripciones de los comandos de barra se muestran a cada usuario en su propio idioma de Discord.
language = "es"

// El token que usa el bot para iniciar sesión en Discord.
// Debe ser un token de BOT (los tokens de usuario no funcionan).
// Si no sabes cómo obtenerlo, consulta esta guía (en inglés):
// https://github.com/jagrosh/MusicBot/wiki/Getting-a-Bot-Token
token = "BOT_TOKEN_HERE"

// El propietario del bot. Debe ser su ID de usuario de Discord (un número de 17-20 dígitos).
// Guide: https://github.com/jagrosh/MusicBot/wiki/Finding-Your-User-ID
owner = OWNER_ID_HERE

// Prefijo de comandos del bot. Necesario para los comandos con prefijo.
// Por ejemplo, con `!` el comando `play` pasa a ser `!play`.
// El prefijo predeterminado es la mención del bot (p. ej. `@NombreDelBot play`).
// Nota: los comandos de barra (/play) siempre funcionan, independientemente del prefijo.
prefix = "@mention"

// Un segundo prefijo (alternativo). Si se establece, se puede usar junto con el prefijo anterior.
// Escribe `NONE` para desactivar el segundo prefijo.
// Predeterminado: `NONE`
altprefix = "NONE"

// Lo que muestra el bot en su línea de estado (la parte de "jugando").
// Puedes escribir "Playing ...", "Listening to ..." o "Watching ..."
// (sustituye ... por cualquier texto). Cualquier otro texto se muestra como estado personalizado.
// Escribe `DEFAULT` para usar el predeterminado.
// Escribe `NONE` para no mostrar nada.
game = "DEFAULT"

// Estado en línea del bot.
// Opciones: `ONLINE` (en línea), `IDLE` (ausente), `DND` (no molestar), `INVISIBLE` (invisible)
// Predeterminado: `ONLINE`
status = ONLINE

// Si es `true`, el bot muestra la canción actual en su línea de estado.
// Solo funciona mientras el bot reproduce música en un único servidor
// (se muestra si reproduce en un solo servidor a la vez, aunque esté en varios).
// Predeterminado: `true`. Ponlo en `false` para desactivarlo.
songinstatus = true

// Emojis usados en las respuestas de los comandos.
success = "🎶"
warning = "💡"
error = "🚫"
loading = "⌚"
searching = "🔎"

// Nombre del comando que muestra la ayuda.
// Por ejemplo, con el prefijo `!` y este valor `comandos`, escribir `!comandos` muestra la ayuda.
// Predeterminado: `help`
help = "help"

// Si es `true`, la ayuda se envía por mensaje directo (MD).
// Predeterminado: `true`
helptodm = true

// Si es `true`, el comando `nowplaying` muestra arriba a la derecha la miniatura de YouTube o la portada del álbum de Spotify.
// Nota: con `true`, el mensaje de `nowplaying` no se actualiza automáticamente
// (las actualizaciones automáticas se desactivan porque la imagen se recargaría en cada actualización).
// Predeterminado: `true`. Ponlo en `false` para desactivarlo.
npimages = true

// Si es `true`, el estado de reproducción se muestra en el apodo del bot.
// Predeterminado: `true`. Ponlo en `false` para desactivarlo.
changenickname = true


// Si es `true`, el comando de ayuda muestra un enlace de invitación al servidor oficial de Cosgy Dev.
officialinvite = false

// Si es `true`, el bot no sale del canal de voz aunque terminen todas las canciones.
// Quedarse en el canal consume ancho de banda extra; no lo actives con una conexión débil.
// Predeterminado: `false`. Ponlo en `true` para activarlo.
stayinchannel = false

// Con `pausenousers` = `true`, el bot pausa la canción cuando todos salen del canal de voz.
// Con `resumejoined` = `true`, se reanuda automáticamente cuando alguien vuelve a entrar.
// Con `stopnousers` = `true`, el bot se detiene por completo en lugar de pausar cuando todos salen.
//
// Si `pausenousers` y `stopnousers` son ambos `true`, se aplica `pausenousers`.
//
// Los tres son `false` por defecto. Ponlos en `true` para activarlos.
pausenousers = false
resumejoined = false
stopnousers = false

// Ponlo en `true` para activar el soporte de Niconico (un sitio de vídeos japonés).
// Nota: el soporte de Niconico es experimental y puede dar problemas.
// Predeterminado: `false`
useniconico = false

// Si useniconico es `true`, introduce el correo y la contraseña de tu cuenta de Niconico.
// nicomail: correo de la cuenta de Niconico
// nicopass: contraseña de la cuenta de Niconico
nicomail = "example@hoge.jp"
nicopass = "0123456789"

// Si tu cuenta de Niconico tiene verificación en dos pasos, introduce la clave secreta.
// Déjalo vacío si no está activada.
// Con la clave correcta, el código se genera y se usa automáticamente al reproducir.
nicotwofactor=""

// Si quieres usar YouTube con sesión iniciada, introduce aquí las credenciales.
// YouTube también funciona sin iniciar sesión; los vídeos exclusivos de Premium necesitan una cuenta Premium.
// Si tu cuenta tiene verificación en dos pasos, usa una contraseña de aplicación.
ytemail = ""
ytpass = ""

// Iniciar sesión en YouTube con una cuenta de Google (para vídeos con restricción de edad / "requiere iniciar sesión").
// Ponlo en true y reinicia el bot. Aparecerá un código en la consola: abre https://www.google.com/device,
// introduce el código y elige la cuenta. El bot detecta el inicio de sesión y guarda el token
// en youtube-oauth.txt; en los siguientes inicios no hace falta volver a iniciar sesión.
// Los vídeos normales se siguen reproduciendo sin cuenta; la cuenta solo se usa cuando fallan los demás métodos.
// IMPORTANTE: usa una cuenta aparte, no la principal. Para vídeos +18 la cuenta debe tener la edad verificada.
// Predeterminado: `false`
youtubeoauth2 = false

// Token de actualización. Déjalo vacío para usar youtube-oauth.txt.
youtubeoauth2refreshtoken = ""

// Si una canción no se puede reproducir de ninguna forma (restricción de edad, vídeo privado…), ¿a quién se avisa?
// "none"    = a nadie; solo se escribe en la consola y el bot pasa a la siguiente canción (predeterminado)
// "dm"      = un mensaje directo (MD) solo a quien pidió la canción
// "channel" = un mensaje visible para todos en el canal del último comando
failnotice = "none"

// CACHÉ DE CANCIONES (carpeta cache)
// Las canciones que YouTube no entrega se descargan con yt-dlp y se guardan en la carpeta cache
// para que suenen al instante si se vuelven a pedir. Si la carpeta supera este tamaño (MB), se borran las canciones
// que llevan más tiempo sin reproducirse (hasta quedar en el 80 % del límite). Una canción ocupa unos 3-5 MB; 1024 MB ≈ 250 canciones.
// Mínimo 100. Predeterminado: 1024
cachelimitmb = 1024

// Para el método alternativo yt-dlp: si pones un "cookies.txt" (formato Netscape) en la carpeta del bot,
// yt-dlp inicia sesión en YouTube con esa cuenta. No hace falta ningún ajuste; basta con que exista el archivo.

// ---------------------------------------------------------------------------
// SPOTIFY
// ---------------------------------------------------------------------------
// Los enlaces de Spotify (canción, álbum, lista, artista) se pueden reproducir con /play, !play y /spotify.
// Como Spotify no entrega audio, la información se lee de Spotify y la misma canción
// se busca en YouTube Music / YouTube y se reproduce desde allí.
//
// Las claves de abajo son OPCIONALES:
//  - Si se dejan vacías, Spotify sigue funcionando (se usa la página pública de Spotify).
//  - Si se rellenan, las canciones sueltas y los álbumes se leen con la API oficial; gracias al código ISRC
//    la grabación CORRECTA se encuentra en YouTube con mucha más precisión. También se activa la búsqueda `spsearch:`.
//
// Para obtener las claves: https://developer.spotify.com/dashboard → "Create app"
//   (puedes poner https://example.com como Redirect URI; selecciona "Web API")
//   Pega aquí el "Client ID" y el "Client secret" de la página Settings de la aplicación.
// Nota: desde 2026, Spotify exige que el propietario de la aplicación tenga Spotify Premium
//   para las aplicaciones en Development Mode. Si no tienes Premium, déjalos vacíos.
// Nota: la página incrustada devuelve como máximo 100 canciones de una lista.
spclient = ""
spsecret = ""

// Duración máxima de reproducción de una canción (segundos).
// 0 o menos significa sin límite.
// Este límite se aplica sea cual sea el origen de la canción.
// Predeterminado: `0`
maxtime = 0

// Cuántos segundos espera el bot antes de salir cuando se queda solo en un canal de voz.
// La cola se vacía al salir. 0 o menos desactiva esta función.
alonetimeuntilstop = 0

// Si se guardan las canciones de la cola cuando el bot sale del canal de voz automáticamente.
// Si es `true`, la cola se guarda (se restaura después con un `/play` vacío). Predeterminado: `false`
autostopqueuesave = false

// Carpeta donde se guardan las listas (ruta relativa o absoluta).
// Predeterminado: `Playlists`
playlistsfolder = Playlists

// Carpeta donde se guardan las listas personales (mylist) (ruta relativa o absoluta).
// Predeterminado: `Mylists`

mylistfolder = Mylists

publistfolder = Publist

// ¿Avisar al propietario por MD cuando salga una nueva versión mientras el bot está en marcha?
// `true` para avisar, `false` para no hacerlo.
// Predeterminado: `true`
updatealerts = true

// ¿Registrar en el log los comandos que ejecutan los usuarios?
// `true` para registrar, `false` para no hacerlo.
auditcommands = false

// ¿Activar el comando `invite`?
// Ponlo en `true` para activarlo. Predeterminado: `false`
useinvitecommand = false

// Nota: las letras se buscan primero en LRCLIB (lrclib.net); el sitio de abajo es solo una alternativa.
// Sitio alternativo para buscar letras.
// Opciones: `"AZ Lyrics"`, `"Genius"`, `"MusicMatch"`, `"LyricsFreak"`
// Por ahora se recomienda `"AZ Lyrics"` o `"MusicMatch"`.
// `"Genius"` a veces devuelve resultados que no son canciones, así que puede no encontrar la letra buscada.
// Para desarrollar un proveedor nuevo, consulta el repositorio de JLyrics: https://github.com/jagrosh/JLyrics
// Predeterminado: `"MusicMatch"`
lyrics.default = "MusicMatch"

// Puedes definir alias adicionales para los comandos. Separa varios con comas.
//
// Ejemplo 1: que el comando "play" funcione también como "p":
// play = [ p ]
//
// Ejemplo 2: que el comando "search" funcione también como "yts" y "find":
// search = [ yts, find ]

aliases {
  // Comandos generales
  help = []
  cache = []
  settings = [status]
  serverinfo = []

  // Comandos de música
  lyrics = []
  nowplaying = [np, current]
  play = [p]
  playlists = [pls]
  queue = [list]
  remove = [delete]
  scsearch = []
  ncsearch = [niconicosearch, nicosearch, ncs, nicos]
  search = [ytsearch]
  shuffle = []
  skip = [voteskip, s]

  // Comandos de administrador
  prefix = [setprefix]
  setdj = []
  setskip = [setskippercent, skippercent, setskipratio]
  settc = []
  setvc = []

  // Comandos de DJ
  forceremove = [forcedelete, modremove, moddelete, modelete]
  forceskip = [modskip, fs]
  movetrack = [move]
  pause = []
  playnext = []
  repeat = [loop]
  skipto = [jumpto]
  stop = []
  volume = [vol]
  spotify = [sp]
}

// `transforms` convierte ciertas entradas en otros tipos de entrada. Su uso es limitado;
// en teoría sirve para crear listas de permitidos/bloqueados, cargar ciertas fuentes de forma indirecta
// y hacer procesamientos personalizados.
//
// No es fácil de configurar; para usarlo tienes que leer el código y entender cómo funciona
// y qué campos hacen falta.
// Esta función podría eliminarse en el futuro si se encuentra un método mejor.
transforms = {}

// Si es `true`, se activa el comando `eval` para el propietario del bot.
// Este comando permite ejecutar cualquier código con la cuenta del bot.
//
// ADVERTENCIA:
// Este comando es muy peligroso.
// Usarlo sin entenderlo bien puede causar problemas graves en tu servidor de Discord o en tu ordenador.
// No actives este comando a menos que sepas exactamente lo que haces.
//
// Si alguien te dice que lo actives y no sabes para qué sirve, no lo hagas.
// Lo más probable es que intente engañarte para que hagas algo peligroso.
// Predeterminado: `false`. Ponlo en `true` solo si entiendes los riesgos.
eval = false
