/// START OF JMUSICBOT-JP CONFIG ///
//______________________________________________________________
//                     ========================
//                      JMusicBot-ML Settings  [lang:en]
//                     ========================
//
// Lines starting with // are ignored (comments).
// You MUST set token and owner.
// All other settings have default values.
// Editing this file with an editor such as Notepad++, VS Code or nano is recommended.
//‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾

// Version of this file. Used to update the file automatically when the bot starts.
// Do not change this value.
configversion = 7

// Bot language. Options: "en" (English), "tr" (Türkçe), "ja" (日本語), "de" (Deutsch), "es" (Español), "ru" (Русский)
// Change it and restart the bot; the comments in this file are translated to that language too.
// Slash command descriptions are shown to each user in their own Discord language.
language = "en"

// The token the bot uses to log in to Discord.
// It must be a BOT token (user tokens do not work).
// If you don't know how to get one, see this guide:
// https://github.com/jagrosh/MusicBot/wiki/Getting-a-Bot-Token
token = "BOT_TOKEN_HERE"

// The bot owner. This must be the owner's Discord user ID (a 17-20 digit number).
// Guide: https://github.com/jagrosh/MusicBot/wiki/Finding-Your-User-ID
owner = OWNER_ID_HERE

// The bot's command prefix. Needed for prefix commands.
// For example, with `!` the `play` command becomes `!play`.
// The default prefix is the bot's mention (e.g. `@BotName play`).
// Note: slash commands (/play) always work regardless of the prefix.
prefix = "@mention"

// A second (alternative) prefix. If set, it can be used together with the prefix above.
// Set it to `NONE` to disable the second prefix.
// Default: `NONE`
altprefix = "NONE"

// What the bot shows in its status line (the "playing" part).
// You can write "Playing ...", "Listening to ..." or "Watching ..."
// (replace ... with any text). Any other text is shown as a custom status.
// Write `DEFAULT` to use the default.
// Write `NONE` to show nothing.
game = "DEFAULT"

// The bot's online status.
// Options: `ONLINE`, `IDLE`, `DND` (do not disturb), `INVISIBLE`
// Default: `ONLINE`
status = ONLINE

// If `true`, the bot shows the current track in its status line.
// This only works while the bot plays music in a single server
// (it is shown if it is playing in only one server at a time, even if it is in several servers).
// Default: `true`. Set to `false` to disable.
songinstatus = true

// Emojis used in command replies.
success = "🎶"
warning = "💡"
error = "🚫"
loading = "⌚"
searching = "🔎"

// Name of the command that shows the help message.
// For example, with prefix `!` and this value `commands`, typing `!commands` shows the help.
// Default: `help`
help = "help"

// If `true`, the help message is sent as a direct message (DM).
// Default: `true`
helptodm = true

// If `true`, the `nowplaying` command shows the YouTube thumbnail or Spotify album cover at the top right.
// Note: while `true`, the `nowplaying` message is not updated automatically
// (automatic updates are turned off because the image would be reloaded on every update).
// Default: `true`. Set to `false` to disable.
npimages = true

// If `true`, the playback state is shown in the bot's nickname.
// Default: `true`. Set to `false` to disable.
changenickname = true


// If `true`, the help command shows an invite link to the official Cosgy Dev Discord server.
officialinvite = false

// If `true`, the bot does not leave the voice channel even when all tracks have finished.
// Staying in the channel uses extra bandwidth; don't enable this on a weak connection.
// Default: `false`. Set to `true` to enable.
stayinchannel = false

// If `pausenousers` = `true`, the bot pauses the track when everyone leaves the voice channel.
// Set `resumejoined` = `true` to resume automatically when someone joins again.
// Set `stopnousers` = `true` to stop completely instead of pausing when everyone leaves.
//
// If both `pausenousers` and `stopnousers` are `true`, `pausenousers` wins.
//
// All three default to `false`. Set to `true` to enable.
pausenousers = false
resumejoined = false
stopnousers = false

// Set to `true` to enable Niconico (a Japanese video site) support.
// Note: Niconico support is experimental and may have various issues.
// Default: `false`
useniconico = false

// If useniconico is `true`, enter your Niconico account's e-mail address and password.
// nicomail: e-mail address of the Niconico account
// nicopass: password of the Niconico account
nicomail = "example@hoge.jp"
nicopass = "0123456789"

// If two-factor authentication is enabled on your Niconico account, enter the secret key.
// Leave empty if it is not enabled.
// With the correct key, the verification code is generated and used automatically when playing.
nicotwofactor=""

// If you want to use YouTube while signed in, enter the credentials here.
// YouTube also works without signing in; however, Premium-only videos need a Premium account.
// If two-factor authentication is enabled on your account, use an app password.
ytemail = ""
ytpass = ""

// Sign in to YouTube with a Google account (for age-restricted / "sign-in required" videos).
// Set to true and restart the bot. A code appears in the console: open https://www.google.com/device,
// enter the code and choose the account. The bot detects the sign-in by itself and saves the token
// to youtube-oauth.txt; you don't need to sign in again on later starts.
// Normal videos are still played without an account; the account is only used when other methods fail.
// IMPORTANT: use a separate account, not your main one. For 18+ videos the account must be age-verified.
// Default: `false`
youtubeoauth2 = false

// Refresh token. Leave empty to use youtube-oauth.txt.
youtubeoauth2refreshtoken = ""

// If a track cannot be played at all (age restriction, private video…), who should be told?
// "none"    = nobody; it is only written to the console and the bot moves to the next track (default)
// "dm"      = a direct message (DM) only to the person who requested the track
// "channel" = a message everyone can see, in the channel where the last command was used
failnotice = "none"

// TRACK CACHE (cache folder)
// Tracks YouTube does not provide are downloaded with yt-dlp and kept in the cache folder
// so they play instantly when requested again. When the folder exceeds this size (MB), the least
// recently played tracks are deleted (until the folder is at 80% of the limit). A track is about 3-5 MB; 1024 MB ≈ 250 tracks.
// Minimum 100. Default: 1024
cachelimitmb = 1024

// For the yt-dlp fallback: if you put a "cookies.txt" (Netscape format) in the bot folder,
// yt-dlp signs in to YouTube with that account. No setting needed; the file being there is enough.

// ---------------------------------------------------------------------------
// SPOTIFY
// ---------------------------------------------------------------------------
// Spotify links (track, album, playlist, artist) can be played with /play, !play and /spotify.
// Since Spotify does not provide audio, track info is read from Spotify and the same track
// is found on YouTube Music / YouTube and played from there.
//
// The keys below are OPTIONAL:
//  - If left empty, Spotify still works (Spotify's public page is used).
//  - If filled in, single tracks and albums are read through the official API; thanks to the ISRC code
//    the RIGHT recording is found on YouTube much more accurately. `spsearch:` search is enabled too.
//
// To get keys: https://developer.spotify.com/dashboard → "Create app"
//   (you can enter https://example.com as the Redirect URI; select "Web API")
//   Paste the "Client ID" and "Client secret" from the app's Settings page here.
// Note: since 2026, Spotify requires the app owner to have Spotify Premium for
//   Development Mode apps. If you don't have Premium, leave these empty.
// Note: the embed page returns at most 100 tracks from a playlist.
spclient = ""
spsecret = ""

// Maximum playback length of a track (seconds).
// 0 or less means no limit.
// This limit applies no matter where the track is loaded from.
// Default: `0`
maxtime = 0

// How many seconds the bot waits before leaving when it is alone in a voice channel.
// The queue is reset when it leaves. 0 or less disables this feature.
alonetimeuntilstop = 0

// Whether to save the tracks in the queue when the bot leaves the voice channel automatically.
// If `true`, the queue is saved (restore it later with an empty `/play`). Default: `false`
autostopqueuesave = false

// Folder where playlists are saved (relative or absolute path).
// Default: `Playlists`
playlistsfolder = Playlists

// Folder where personal lists (mylist) are saved (relative or absolute path).
// Default: `Mylists`

mylistfolder = Mylists

publistfolder = Publist

// Should the owner be notified by DM when a new version is released while the bot is running?
// `true` to notify, `false` not to.
// Default: `true`
updatealerts = true

// Should commands run by users be written to the log?
// `true` to log, `false` not to.
auditcommands = false

// Enable the `invite` command?
// Set to `true` to enable. Default: `false`
useinvitecommand = false

// Note: lyrics are first looked up on LRCLIB (lrclib.net); the site below is only a fallback.
// Fallback site to search lyrics on.
// Options: `"AZ Lyrics"`, `"Genius"`, `"MusicMatch"`, `"LyricsFreak"`
// `"AZ Lyrics"` or `"MusicMatch"` is recommended for now.
// `"Genius"` sometimes returns non-song results, so the wanted lyrics may not be found.
// To develop a new provider, see the JLyrics repository: https://github.com/jagrosh/JLyrics
// Default: `"MusicMatch"`
lyrics.default = "MusicMatch"

// You can define extra aliases for commands. Separate multiple ones with commas.
//
// Example 1: make the "play" command also work as "p":
// play = [ p ]
//
// Example 2: make the "search" command also work as "yts" and "find":
// search = [ yts, find ]

aliases {
  // General commands
  help = []
  cache = []
  settings = [status]
  serverinfo = []

  // Music commands
  lyrics = []
  nowplaying = [np, current]
  play = [p]
  playlists = [pls]
  queue = [list]
  remove = [delete]
  scsearch = []
  ncsearch = [niconicosearch, nicosearch, ncs, nicos]
  search = [ytsearch]
  shuffle = []
  skip = [voteskip, s]

  // Admin commands
  prefix = [setprefix]
  setdj = []
  setskip = [setskippercent, skippercent, setskipratio]
  settc = []
  setvc = []

  // DJ commands
  forceremove = [forcedelete, modremove, moddelete, modelete]
  forceskip = [modskip, fs]
  movetrack = [move]
  pause = []
  playnext = []
  repeat = [loop]
  skipto = [jumpto]
  stop = []
  volume = [vol]
  spotify = [sp]
}

// `transforms` converts certain inputs into other kinds of inputs. Its use is limited;
// in theory it can be used to build allow/deny lists, load certain sources indirectly
// and do custom processing.
//
// It is not easy to set up; to use it you need to read the code to understand how it works
// and which fields are required.
// This feature may be removed entirely in the future if a better method is found.
transforms = {}

// If `true`, the `eval` command is enabled for the bot owner.
// This command lets you run any code with the bot's account.
//
// WARNING:
// This command is very dangerous.
// Using it without fully understanding it can cause serious problems in your Discord server or on your computer.
// Do not enable this command unless you know exactly what you are doing.
//
// If someone tells you to enable it and you don't know what it does, don't.
// They are most likely trying to trick you into doing something dangerous.
// Default: `false`. Set to `true` only if you understand the risks.
eval = false
/// END OF JMUSICBOT-JP CONFIG ///
